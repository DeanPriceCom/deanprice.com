name: Keepalive Watchdog

on:
  schedule:
    # Runs on the 1st and 15th of every month at 00:00 UTC
    - cron: '0 0 1,15 * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  keepalive:
    name: Prevent 60-Day Cron Inactivity Deactivation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Keepalive Workflow
        uses: gautamkrishnar/keepalive-workflow@v2
