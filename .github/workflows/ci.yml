name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Verify Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Verify code formatting (gofmt -s)
        run: |
          UNFORMATTED=$(git ls-files -- '*.go' | xargs -r gofmt -s -l)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::The following Go files are not formatted (run 'gofmt -s -w .'):"
            echo "$UNFORMATTED"
            echo "$UNFORMATTED" | xargs -r gofmt -s -d
            exit 1
          fi

      - name: Generate assets & CSP headers
        run: go generate ./...

      - name: Verify generated files were committed in sync
        run: git diff --exit-code _headers index.html 404.html

      - name: Run static analysis (go vet)
        run: go vet ./...

      - name: Run Unit Tests
        run: go test -v -count=1 ./...

      - name: Set up TinyGo
        uses: acifani/setup-tinygo@v2
        with:
          tinygo-version: '0.41.1'

      - name: Verify TinyGo WebAssembly compilation, sub-50 KB budget, wasm_exec.js parity & dist assembly
        run: |
          sed 's/this\._goRefCounts?\.\[id\]/this._goRefCounts \&\& this._goRefCounts[id]/' "$(tinygo env TINYGOROOT)/targets/wasm_exec.js" | diff -u --strip-trailing-cr - wasm_exec.js
          tinygo build -opt=z -no-debug -panic=trap -target wasm -o main.wasm .
          WASM_BYTES=$(wc -c < main.wasm)
          echo "Compiled main.wasm size: ${WASM_BYTES} bytes"
          if [ "$WASM_BYTES" -le 0 ] || [ "$WASM_BYTES" -gt 51200 ]; then
            echo "::error::main.wasm size (${WASM_BYTES} bytes) exceeds 50 KB (51200 bytes) micro-WASM budget!"
            exit 1
          fi
          go run ./tools -task=dist
          rm -rf main.wasm dist

      - name: Validate build script syntax
        run: bash -n scripts/build.sh

