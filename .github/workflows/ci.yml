name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Verify Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Generate assets & CSP headers
        run: go generate ./...

      - name: Verify _headers was committed in sync with index.html
        run: git diff --exit-code _headers

      - name: Run Unit Tests
        run: go test -v -count=1 ./...

      - name: Validate build script syntax
        run: bash -n scripts/build.sh

