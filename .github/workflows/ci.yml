name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Verify Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Verify code formatting (gofmt -s)
        run: |
          UNFORMATTED=$(git ls-files -- '*.go' | xargs -r gofmt -s -l)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::The following Go files are not formatted (run 'gofmt -s -w .'):"
            echo "$UNFORMATTED"
            echo "$UNFORMATTED" | xargs -r gofmt -s -d
            exit 1
          fi

      - name: Generate assets & CSP headers
        run: go generate ./...

      - name: Verify _headers was committed in sync with index.html
        run: git diff --exit-code _headers

      - name: Run static analysis (go vet)
        run: go vet ./...

      - name: Run Unit Tests
        run: go test -v -count=1 ./...

      - name: Set up TinyGo
        uses: acifani/setup-tinygo@v2
        with:
          tinygo-version: '0.41.1'

      - name: Verify TinyGo WebAssembly compilation (Cloudflare Pages parity)
        run: tinygo build -opt=z -no-debug -panic=trap -target wasm -o /dev/null .

      - name: Validate build script syntax
        run: bash -n scripts/build.sh

