        html, body { 
            margin: 0; 
            padding: 0; 
            min-height: 100vh;
            min-height: 100dvh;
            background: radial-gradient(circle at top, #4494A3 0%, #4494A3 20%, #96E4EF 75%);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            -webkit-text-size-adjust: 100%;
        }

        .shieldcard {
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px);
            padding: clamp(30px, 8vw, 50px); 
            border-radius: 24px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            max-width: 450px; 
            width: 90%; 
            margin: 0; 
            border: 2px solid white;
            box-sizing: border-box;
        }

        h1 {
            color: #4363b0;
            font-family: 'Patrick Hand', cursive;
            font-size: clamp(1.8rem, 7vw, 2.5rem);
            margin-top: 0;
            margin-bottom: 10px;
            line-height: 1.2;
        }

        p { 
            color: #433B31; 
            font-family: 'Patrick Hand', cursive; 
            line-height: 1.6; 
            font-size: clamp(1.1rem, 4vw, 1.4rem);
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            background: #4363b0;
            color: #FFFFFF;
            font-family: 'Patrick Hand', cursive;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 50px;
            font-size: 1.2rem;
            transition: transform 0.2s, background 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 15px rgba(67, 99, 176, 0.2);
        }

        .btn:hover {
            background: #365296;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(67, 99, 176, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }
